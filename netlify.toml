[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Next.js, Netlify tarafında OpenNext adaptörüyle çalışır. Adaptör
# `package.json` içinde tanımlı olduğu için CLI ile yapılan yerel
# derlemelerde de (GitHub Actions / manuel yayın) aynı sürüm kullanılır.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/dergi/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    # Netlify `application/pdf` yanıtlarını brotli ile sıkıştırıyor; sıkıştırılmış
    # yanıtta Content-Length olmadığı için PDF.js aralık (Range) desteğini
    # algılayamıyor ve 88 MB'lik dosyanın TAMAMINI indiriyordu. Bu içerik türü
    # sıkıştırma listesinde olmadığından kısmi indirme yeniden çalışır.
    Content-Type = "application/octet-stream"
